<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#F6F4FB;color:#17132E;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;">
<!-- Preview text shown next to the subject in most inboxes -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#F6F4FB;">{{preheader}}&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F4FB;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
        <tr>
          <td style="background:#130E33;border-radius:20px 20px 0 0;padding:22px 32px;">
            <a href="{{storeUrl}}" style="color:#FFFFFF;text-decoration:none;font-size:22px;font-weight:800;letter-spacing:0.02em;">NOVA<span style="color:#FF5CA8;font-size:16px;vertical-align:top;">&#10022;</span></a>
          </td>
        </tr>
        <tr>
          <td style="background:#FFFFFF;border-radius:0 0 20px 20px;padding:32px;font-size:16px;line-height:1.55;color:#17132E;">
{{{content}}}
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 0;font-size:13px;line-height:1.6;color:#5E5A73;text-align:center;">
            Questions? Reply to this email or write to <a href="mailto:{{supportEmail}}" style="color:#17132E;">{{supportEmail}}</a>.<br>
            <a href="{{storeUrl}}" style="color:#5E5A73;">NOVA</a> &middot; &copy; {{year}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
