<p style="margin:0 0 10px;">
  <span style="display:inline-block;padding:4px 10px;border-radius:4px;background:{{statusTint}};color:{{statusColor}};font-size:13px;font-weight:700;">{{statusLabel}}</span>
  <span style="font-size:14px;color:#5E5A73;">&nbsp;Order #{{orderId}}</span>
</p>
<h1 style="margin:0 0 12px;font-size:26px;line-height:1.2;font-weight:800;">{{headline}}</h1>
<p style="margin:0 0 20px;">Hi {{firstName}}, {{message}}</p>

{{{noteHtml}}}

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:15px;">
{{{itemsHtml}}}
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px;">
  <tr>
    <td style="background:#17132E;border-radius:12px;">
      <a href="{{trackUrl}}" style="display:inline-block;padding:14px 26px;color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none;">Track your order</a>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:13px;color:#5E5A73;">Enter order number {{orderId}} and this email address to see every update.</p>
